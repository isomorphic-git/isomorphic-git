name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**

# Cancel in-progress runs for the current workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest

    env:
      TEST_PUSH_GITHUB_TOKEN: ${{ secrets.TEST_PUSH_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Run lint
        run: |
          npx nps lint

      - name: Run build
        run: |
          # Run the subset of the `build` necessary to run the tests.
          npx nps build.rollup build.typings build.webpack build.indexjson build.treeshake build.size
        env:
          BUNDLEWATCH_GITHUB_TOKEN: ${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}

      - name: Run tests (CLI)
        run: |
          # `test.typecheck` must be run after `build.rollup` and `build.typings`
          npx nps test.typecheck test.setup test.node

      - name: Save test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jest-${{ matrix.os }}
          path: junit/*.xml

      # Problem: GitHub does not support Code Coverage reports like Azure Pipelines.
      # TODO:    Update the workflow to "Publish code coverage" somewhere.

      - name: Save code coverage
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-results-${{ matrix.os }}
          path: coverage/

      - name: Build artifacts
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        shell: bash
        run: |
          # Run the subset of the `test` necessary to test from the CLI.
          npx nps build.docs build.pack

          # Warn when there are uncommitted changes to documentation
          if ! git diff --quiet --exit-code; then
            echo "::warning title=Uncommitted Changes to Documentation::There are uncommitted changes to the documentation. Please run \`nps build.docs\` and commit the changes."
          fi

      - name: Save npm-tarball.tgz
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball.tgz-${{ matrix.os }}
          path: isomorphic-git-0.0.0-development.tgz

      - name: Save index.umd.min.js
        if: ${{ !cancelled() && !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-artifact@v4
        with:
          name: index.umd.min.js-${{ matrix.os }}
          path: index.umd.min.js

  test-in-browser:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest

    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: |
          npx nps \
            build.rollup \
            build.webpack \
            build.indexjson \
            build.treeshake

      - name: Run browser tests (${{ matrix.browser }})
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0, 1920x1080x24' npx nps \
            test.setup \
            test.${{ matrix.browser }}
        env:
          TEST_BROWSERS: ${{ matrix.browser }}

      - name: Save test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: junit/*.xml


  publish-test-results:
    name: Publish Test Results
    needs: [build, test-in-browser]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}

    timeout-minutes: 5

    steps:
      - name: Download test results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4

      # Problem: GitHub does not support Test Results reports like Azure Pipelines.
      # TODO:    Update the workflow to combine and "Publish test results" somewhere.

      - name: Publish test results
        if: ${{ !cancelled() }}
        run: |
          # List the test results
          echo test-results-*/*.xml

          # TODO: Combine and publish the test results

  publish-artifacts:
    name: Publish
    needs: test-in-browser
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'main' || github.ref_name == 'beta' }}

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Configure git identity for release
        run: |
          git config user.name "isomorphic-git-bot"
          git config user.email "wmhilton+isomorphic-git-bot@gmail.com"

      - name: Publish to npm
        run: |
          npm run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update website
        if: ${{ github.ref == 'main' }}
        run: |
          npm run publish-website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
