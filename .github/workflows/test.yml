name: Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x]
        browser: [node]
        include:
          - os: ubuntu-latest
            node-version: 20.x
            browser: chrome
          - os: ubuntu-latest
            node-version: 20.x
            browser: firefox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npx nps build.test

      - name: Start test environment (Proxy & Mock Git Server)
        run: npx nps test.setup

      - name: Run Node tests
        if: matrix.browser == 'node'
        run: npx nps test.node

      - name: Run Chrome browser tests
        if: matrix.browser == 'chrome'
        run: npx nps test.chrome
        env:
          JEST_BROWSER: chrome

      - name: Run Firefox browser tests
        if: matrix.browser == 'firefox'
        run: npx nps test.firefox
        env:
          JEST_BROWSER: firefox

      - name: Teardown test environment
        if: always()
        run: npx nps test.teardown
